# The Xcode project is generated from this file (XcodeGen): `xcodegen generate`.
name: Starlite
options:
  bundleIdPrefix: io.github.turtlemaxx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.6"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Starlite:
    type: application
    platform: iOS
    sources:
      - Starlite
      - Shared
    dependencies:
      - target: StarliteWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.turtlemaxx.starlite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Starlite/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Starlite/Starlite.entitlements
    entitlements:
      path: Starlite/Starlite.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.turtlemaxx.starlite
    info:
      path: Starlite/Info.plist
      properties:
        CFBundleDisplayName: Starlite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Starlite connects to your Navidrome or Jellyfin server on your network.
        NSPhotoLibraryUsageDescription: Pick a picture for your own theme's background.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sideloading tools rename the App Group; these tell them (and us) its name.
        ALTAppGroups: [group.io.github.turtlemaxx.starlite]
        StarliteAppGroup: group.io.github.turtlemaxx.starlite
        CFBundleURLTypes:
          - CFBundleURLName: io.github.turtlemaxx.starlite
            CFBundleURLSchemes: [starlite]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    scheme: {}

  # The home-screen widget (now playing, 2×4).
  StarliteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.turtlemaxx.starlite.widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/StarliteWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/StarliteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.turtlemaxx.starlite
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Starlite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # It asks the app on 127.0.0.1 (sideloaded, there's no App Group).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ALTAppGroups: [group.io.github.turtlemaxx.starlite]
        StarliteAppGroup: group.io.github.turtlemaxx.starlite
